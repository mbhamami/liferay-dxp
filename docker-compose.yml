services:
  # ----------------------------------------------------------------------------
  # Base de données PostgreSQL pour Liferay DXP
  # ----------------------------------------------------------------------------
  liferay-db:
    image: postgres:16
    container_name: liferay-db
    environment:
      POSTGRES_DB: lportal
      POSTGRES_USER: liferay
      POSTGRES_PASSWORD: liferay
    volumes:
      - liferay-db-data:/var/lib/postgresql/data
    networks:
      - liferay-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liferay -d lportal"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # Base de données PostgreSQL pour Keycloak
  # ----------------------------------------------------------------------------
  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - liferay-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # Keycloak (mode développement)
  # Console admin : http://localhost:8180  (admin / admin)
  # ----------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    # --import-realm : importe automatiquement les realms présents dans
    # /opt/keycloak/data/import au démarrage (idempotent — n'écrase pas
    # un realm déjà existant en base).
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Front-channel : URL publique vue par le navigateur (port host mappé).
      KC_HOSTNAME: http://localhost:18280
      KC_HOSTNAME_STRICT: "false"
      # Back-channel dynamique : Liferay appelle /token, /userinfo, /jwks via
      # http://keycloak:8080 (réseau Docker) — ces URLs sont dérivées du host
      # de la requête au lieu de KC_HOSTNAME.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "18280:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - liferay-net

  # ----------------------------------------------------------------------------
  # Liferay Portal CE 7.4 (édition communautaire, image publique)
  # Portail : http://localhost:18080
  # ----------------------------------------------------------------------------
  liferay:
    image: liferay/dxp:2025.q3.0
    container_name: liferay
    ports:
      - "18080:8080"  # HTTP du portail (host 18080 -> container 8080)
      - "11311:11311" # Console Gogo (OSGi)
      - "8000:8000"   # Debug JPDA (optionnel)
    environment:
      # --- Connexion JDBC vers PostgreSQL ---------------------------------
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_DRIVER_UPPERCASEC_LASS_UPPERCASEN_AME: org.postgresql.Driver
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_URL: jdbc:postgresql://liferay-db:5432/lportal
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_USERNAME: liferay
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_PASSWORD: liferay

      # --- Désactivation du setup wizard ---------------------------------
      LIFERAY_SETUP_PERIOD_WIZARD_PERIOD_ENABLED: "false"

      # --- Migration automatique du schéma de base ----------------------
      # Indispensable lors d'une montée de version (ex. Q1 -> Q3) : Liferay
      # exécute l'upgrade du schéma au démarrage au lieu de s'arrêter avec
      # « You must first upgrade the portal to the required schema version ».
      LIFERAY_UPGRADE_PERIOD_DATABASE_PERIOD_AUTO_PERIOD_RUN: "true"

      # --- Compte administrateur par défaut ------------------------------
      LIFERAY_ADMIN_PERIOD_EMAIL_PERIOD_FROM_PERIOD_ADDRESS: admin@liferay.com
      LIFERAY_ADMIN_PERIOD_EMAIL_PERIOD_FROM_PERIOD_NAME: Liferay Admin

      # --- Locale / fuseau horaire ---------------------------------------
      LIFERAY_USERS_PERIOD_REMINDER_PERIOD_QUERIES_PERIOD_ENABLED: "false"
      LIFERAY_COMPANY_PERIOD_DEFAULT_PERIOD_LOCALE: fr_FR
      LIFERAY_COMPANY_PERIOD_DEFAULT_PERIOD_TIME_PERIOD_ZONE: Europe/Paris
    volumes:
      - liferay-data:/opt/liferay/data
      - ./liferay/deploy:/opt/liferay/deploy
      - ./liferay/files:/mnt/liferay/files
      # Pré-provisionnement OSGi : active OpenID Connect et déclare le
      # fournisseur Keycloak sans intervention manuelle.
      - ./liferay/osgi/configs:/opt/liferay/osgi/configs
    depends_on:
      liferay-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - liferay-net

  # ----------------------------------------------------------------------------
  # Base de données PostgreSQL pour la 2e instance Liferay (DXP 2026)
  # Base dédiée (lportal2) : deux instances Liferay ne partagent jamais la
  # même base de données.
  # ----------------------------------------------------------------------------
  liferay2-db:
    image: postgres:16
    container_name: liferay2-db
    environment:
      POSTGRES_DB: lportal2
      POSTGRES_USER: liferay
      POSTGRES_PASSWORD: liferay
    volumes:
      - liferay2-db-data:/var/lib/postgresql/data
    networks:
      - liferay-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liferay -d lportal2"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # 2e instance Liferay DXP 2026.q1.0 (LTS)
  # Portail : http://localhost:28080 — connectée au MÊME Keycloak que liferay.
  # ----------------------------------------------------------------------------
  liferay2:
    image: liferay/dxp:2026.q1.0-lts
    container_name: liferay2
    ports:
      - "28080:8080"   # HTTP du portail (host 28080 -> container 8080)
      - "21311:11311"  # Console Gogo (OSGi)
      - "8001:8000"    # Debug JPDA (optionnel)
    environment:
      # --- Connexion JDBC vers SA PROPRE base PostgreSQL -----------------
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_DRIVER_UPPERCASEC_LASS_UPPERCASEN_AME: org.postgresql.Driver
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_URL: jdbc:postgresql://liferay2-db:5432/lportal2
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_USERNAME: liferay
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_PASSWORD: liferay

      # --- Désactivation du setup wizard ---------------------------------
      LIFERAY_SETUP_PERIOD_WIZARD_PERIOD_ENABLED: "false"

      # --- Migration automatique du schéma de base ----------------------
      LIFERAY_UPGRADE_PERIOD_DATABASE_PERIOD_AUTO_PERIOD_RUN: "true"

      # --- Compte administrateur par défaut ------------------------------
      LIFERAY_ADMIN_PERIOD_EMAIL_PERIOD_FROM_PERIOD_ADDRESS: admin@liferay.com
      LIFERAY_ADMIN_PERIOD_EMAIL_PERIOD_FROM_PERIOD_NAME: Liferay Admin

      # --- Locale / fuseau horaire ---------------------------------------
      LIFERAY_USERS_PERIOD_REMINDER_PERIOD_QUERIES_PERIOD_ENABLED: "false"
      LIFERAY_COMPANY_PERIOD_DEFAULT_PERIOD_LOCALE: fr_FR
      LIFERAY_COMPANY_PERIOD_DEFAULT_PERIOD_TIME_PERIOD_ZONE: Europe/Paris
    volumes:
      - liferay2-data:/opt/liferay/data
      - ./liferay2/deploy:/opt/liferay/deploy
      # Mêmes configs OSGi OIDC (copie dédiée) : active OpenID Connect et
      # déclare le MÊME fournisseur Keycloak (discovery via http://keycloak:8080).
      - ./liferay2/osgi/configs:/opt/liferay/osgi/configs
    depends_on:
      liferay2-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - liferay-net

volumes:
  liferay-db-data:
  keycloak-db-data:
  liferay-data:
  liferay2-db-data:
  liferay2-data:

networks:
  liferay-net:
    driver: bridge
